<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ateliê Rosé">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="demo-db.js"></script>
<title>Ateliê Rosé · Agenda</title>
<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, pensado pro celular; abas fixas embaixo, conteúdo rola acima.
   Identidade da Ateliê Rosé · Manicure e Pedicure: preto e rosé (rose gold do logo),
   serifa clássica nos títulos, como no logo. Topo preto, conteúdo claro nude. */
:root{
  color-scheme:light only;
  --bg:#F6EFEC; --surface:#FFFBF9; --ink:#1F1A19; --muted:#8A7670; --line:#EADBD5;
  --accent:#8E5F50; --accent-ink:#FFFFFF; --accent-soft:#F1E1DA;
  --rose:#D3A898;
  --gold:linear-gradient(135deg,#2A2120 0%,#141010 60%,#000 100%);
  --gold-text:linear-gradient(180deg,#B98A7A 0%,#8E5F50 100%);
  --ok:#3F7A4E; --ok-soft:#E4F0E2; --warn:#A35E12; --warn-soft:#FBEBD3; --bad:#A83A2E; --bad-soft:#F6E1DC;
  --info:#5A6E8C; --info-soft:#E8ECF2;
  --f-display:"Cormorant Garamond", Georgia, serif;
  --f-body:"Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"Montserrat", system-ui, -apple-system, sans-serif;
  --r:14px;
}
html,body{height:100%}
body{background:var(--bg) radial-gradient(120% 60% at 50% 0%,#FCF6F3 0%,transparent 70%) no-repeat;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px;border-bottom:1px solid var(--line);margin-bottom:14px;position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#C9A091,transparent)}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.mono{width:46px;height:46px;border-radius:50%;border:1.5px solid #8E5F50;box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px #E3CBC1;display:flex;align-items:center;justify-content:center;flex:none;background:var(--surface)}
.mono b{font:600 19px var(--f-display);letter-spacing:-.04em;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.05;letter-spacing:.06em;text-wrap:balance;min-width:0}
.brand .pre{display:block;font:500 10.5px var(--f-display);letter-spacing:.42em;color:var(--muted);margin-bottom:3px}
.brand .nm{background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-family:var(--f-body);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.today{font-size:12.5px;color:var(--muted);text-align:right}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid #E3CBC1;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:760px}
nav.tabs button{background:none;border:0;padding:10px 4px 9px;font:600 12px var(--f-body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .dot{position:absolute;top:6px;right:calc(50% - 18px);background:var(--accent);color:var(--accent-ink);font:700 10px var(--f-body);border-radius:9px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center}
h2.sec{font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:20px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
button,.btn{font:600 14px var(--f-body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--gold);border-color:#2E2A28;color:var(--accent-ink);text-shadow:0 1px 1px rgba(0,0,0,.25);box-shadow:0 2px 8px rgba(30,25,22,.18)}
.btn-wa{background:#1F8B4C;border-color:#1F8B4C;color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn-danger{color:var(--bad);border-color:var(--bad-soft)}
.icon{width:16px;height:16px;flex:none}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datebar .label{flex:1;min-width:0;font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;text-align:center;color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.week button{flex-direction:column;padding:6px 0;gap:0;border-radius:10px;font-size:11px;color:var(--muted);justify-content:center}
.week button b{font:600 16px var(--f-body);color:var(--ink)}
.week button i{font-style:normal;font-size:10px;color:var(--accent);min-height:13px}
.week button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week button[aria-pressed="true"] b,.week button[aria-pressed="true"] i{color:var(--accent-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px}
.chip{font:600 13px var(--f-body);border-radius:999px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--gold);color:#fff;border-color:#2E2A28}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.list{display:flex;flex-direction:column;gap:8px}
.appt.bloq{background:repeating-linear-gradient(135deg,var(--surface) 0 10px,rgba(120,110,100,.07) 10px 20px);border-style:dashed}
.cal .ev.bloq{background:#e6e0d7;color:#6f675d;border-left-color:#9b948a}
.achou{display:grid;gap:6px;margin:-4px 0 4px}
.achou .line{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.aviso{background:#F8ECE7;border:1px solid #E0C3B8;border-radius:10px;padding:8px 10px;font-size:.92em}
.busca-ag{margin-bottom:12px}
.hist .line{align-items:flex-start}
.hist small{display:block}
.appt{display:grid;grid-template-columns:62px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;border-left:4px solid var(--c,var(--accent))}
.appt .h{font:500 15px var(--f-num);font-variant-numeric:tabular-nums}
.appt .h small{display:block;font-size:11px;color:var(--muted)}
.appt .who{font-weight:700;font-size:16px}
.appt .what{color:var(--muted);font-size:13.5px}
.appt .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pill{font:700 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 8px;display:inline-block}
.st-agendado{background:var(--info-soft);color:var(--info)}
.st-confirmado{background:var(--accent-soft);color:var(--accent)}
.st-concluido{background:var(--ok-soft);color:var(--ok)}
.st-faltou{background:var(--warn-soft);color:var(--warn)}
.st-cancelado{background:var(--bad-soft);color:var(--bad)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi b{display:block;font:500 18px var(--f-num);font-variant-numeric:tabular-nums;margin-top:4px;overflow-wrap:anywhere}
.money{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .grow small{display:block;color:var(--muted);font-size:12.5px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--c,var(--accent))}
input,select,textarea{font:15px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{margin-bottom:12px}
.client{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 15px var(--f-body);display:flex;align-items:center;justify-content:center;flex:none}
.due{display:grid;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.due.late{border-color:var(--warn)}
.tag{font-size:12px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(25,20,18,.42);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.modal h3{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px;text-wrap:balance;color:var(--accent)}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90%;text-align:center}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.ph{font:500 12px var(--f-num);color:var(--muted)}
.svc{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.svc:last-child{border:0}
.wa-num{font:500 12px var(--f-num);color:var(--muted);user-select:all}
.reserva{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;justify-content:center;padding-inline:12px;pointer-events:none}
.reserva .box{pointer-events:auto;width:100%;max-width:736px;max-height:58vh;overflow:auto;background:var(--surface);border:2px solid #8E5F50;border-radius:16px;box-shadow:0 -8px 30px rgba(0,0,0,.25);padding:14px}
.reserva h3{font-family:var(--f-display);font-weight:500;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 2px}
.reserva .it{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:grid;gap:6px}
.reserva .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.reserva .nums div{background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.reserva .nums span{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.reserva .nums b{font:500 15px var(--f-num);font-variant-numeric:tabular-nums}
.reserva .dep{font-size:15px}
.reserva .dep b{font:600 18px var(--f-num);color:var(--accent)}
body.tem-reserva .wrap{padding-bottom:360px}
/* fora do Claude não vem essa regra pronta: elemento com hidden some de verdade (login, toast, formulários) */
[hidden]{display:none!important}
/* logo da Ateliê Rosé no topo e faixa de demonstração */
.logoimg{height:76px;width:auto;display:block;margin:-6px 0 -6px -10px}
body{margin:0}
html{scrollbar-width:none}
header.top{background:#000;margin:-12px -16px 16px;padding:14px 16px;border-bottom:1px solid #000;border-radius:0 0 20px 20px}
header.top .today{color:var(--rose);letter-spacing:.06em}
@media (min-width:792px){header.top{margin-inline:0}}
nav.tabs button>span{white-space:nowrap;display:inline-flex;align-items:center}
.trava{display:inline-flex;margin-left:3px;opacity:.7}
nav.tabs button .trava svg{width:10px;height:10px}
.bloq{text-align:center;padding:30px 20px;display:grid;gap:12px;justify-items:center;background:#000;color:#F3E3DC;border-radius:18px;margin-top:6px}
.bloq svg{width:34px;height:34px;color:var(--rose)}
.bloq h2{font:600 26px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--rose);margin:0}
.bloq p{margin:0;font-size:14px;line-height:1.55;max-width:34ch;color:#E6D3CB}
.bloq ul{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:8px;text-align:left;font-size:13.5px;color:#F3E3DC}
.bloq li::before{content:"✦";color:var(--rose);margin-right:8px}
.bloq .sel{font:500 11px var(--f-body);letter-spacing:.3em;text-transform:uppercase;color:var(--rose);border:1px solid #5A403A;border-radius:99px;padding:7px 14px;margin-top:6px}
.vsite{display:block;margin-top:4px;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);text-decoration:none}
.demo{display:flex;align-items:baseline;gap:8px;border-bottom:1px dashed #CDB0A5;padding:0 2px 8px;font-size:12px;color:var(--muted);margin-bottom:12px}
.demo b{color:var(--ink);font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:11px}
/* tela de login (fora do Claude, cada uma entra com o próprio e-mail e senha) */
.login{position:fixed;inset:0;z-index:80;background:var(--bg) radial-gradient(120% 70% at 50% 0%,#FCF6F3 0%,transparent 70%) no-repeat;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow:auto}
.lgbox{width:100%;max-width:360px;display:grid;gap:12px;text-align:center}
.lgmono{width:72px;height:72px;margin:0 auto 4px}
.lgmono b{font-size:30px}
.lgpre{font:500 12px var(--f-display);letter-spacing:.5em;color:var(--muted)}
.lgnome{font:600 30px var(--f-display);letter-spacing:.06em;margin:0;background:var(--gold-text);-webkit-background-clip:text;background-clip:text;color:transparent}
.lgcid{font:500 11px var(--f-display);letter-spacing:.4em;color:var(--muted);margin-bottom:10px}
.lgcid::before,.lgcid::after{content:"";display:inline-block;width:28px;height:1px;background:#C9A091;vertical-align:middle;margin:0 10px}
.lgbox label.f{text-align:left}
body.sem-login nav.tabs,body.sem-login #reservaRoot{display:none}

/* calendário do mês: cada dia mostra os horários em miniatura, como no app Calendário do iPhone */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px;box-shadow:0 1px 0 #fff inset,0 6px 18px rgba(40,30,25,.06)}
.cal .dw{font:600 10.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:7px 0 6px;border-bottom:1px solid var(--line);background:linear-gradient(#FBF3F0,#F3E6E0)}
.cal .cell{all:unset;box-sizing:border-box;min-height:84px;min-width:0;padding:3px 2px 4px;border-top:1px solid var(--line);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer;overflow:hidden}
.cal .cell:nth-child(7n+1){border-left:0}
.cal .cell:nth-child(-n+14){border-top:0}
.cal .cell:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.cal .n{align-self:center;font:600 12.5px var(--f-body);width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);font-variant-numeric:tabular-nums;flex:none}
.cal .cell.fora .n{color:#CDB0A5}
.cal .cell.fora .ev{opacity:.45}
.cal .cell.hoje .n{background:var(--gold);color:#fff}
.cal .cell.sel{background:var(--accent-soft)}
.cal .cell.sel:not(.hoje) .n{border:1.5px solid #8E5F50}
.cal .ev{display:block;font:600 9.5px/1.25 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:clip;border-radius:3px;padding:1px 2px 1px 3px;border-left:2px solid var(--c,var(--accent));background:color-mix(in srgb,var(--c,#B0843A) 15%,transparent);color:var(--ink)}
.cal .ev.ok{opacity:.55}
.cal .ev.conf{font-weight:700}
.cal .ev s{text-decoration:none;color:var(--muted);font-weight:500;display:none}
.cal .more{font:600 9.5px var(--f-body);color:var(--accent);text-align:center}
@media (min-width:560px){.cal .cell{min-height:104px;padding:4px}.cal .ev{font-size:11px}.cal .ev s{display:inline}.cal .more{font-size:11px}}
.dayhead{display:flex;align-items:baseline;gap:8px;margin:4px 0 10px}
.dayhead h2{font:600 18px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0;flex:1;min-width:0}
/* mensagens do dia: confirmar 24h–12h antes */
.msgbox{background:var(--surface);border:1.5px solid #DDC2B7;border-radius:var(--r);padding:10px 12px;margin-bottom:12px}
.msgbox summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font:600 14px var(--f-display);letter-spacing:.02em;color:var(--accent)}
.msgbox summary::-webkit-details-marker{display:none}
.msgbox summary .cnt{background:var(--gold);color:#fff;font:700 12px var(--f-body);border-radius:999px;min-width:22px;height:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
.msgbox summary .urg{font:600 12px var(--f-body)}
.msgbox summary::after{content:"›";margin-left:auto;font:400 22px var(--f-body);transition:transform .15s;color:var(--muted)}
.msgbox[open] summary::after{transform:rotate(90deg)}
.msgbox[open] summary{margin-bottom:6px}
.msgbox .it{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;display:grid;gap:6px}
.urg{color:var(--bad);font-weight:700}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:last-child{grid-column:1/-1}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="logo"><img class="logoimg" src="logo.png" alt="Ateliê Rosé · Manicure e Pedicure"><b id="mono" hidden></b><div id="brand" hidden></div></div>
    <div class="today"><span id="todayLbl"></span></div>
  </header>
  <div id="banner"></div>
  <main id="view"><div class="empty"><b>Carregando a agenda…</b>Os agendamentos, clientes e o caixa aparecem aqui em instantes.</div></main>
</div>

<nav class="tabs" aria-label="Seções"><div class="in">
  <button data-tab="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>

<script>
(function(){
"use strict";
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const DOW = ["dom","seg","ter","qua","qui","sex","sáb"];
const MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const fmtDia = s => { const d = parseYmd(s); return DOW[d.getDay()]+", "+d.getDate()+" de "+MES[d.getMonth()]; };
const fmtCurto = s => { const d = parseYmd(s); return pad(d.getDate())+"/"+pad(d.getMonth()+1); };
const brl = v => (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num = v => { if (v === "" || v == null) return null; const n = Number(String(v).replace(/\./g,"").replace(",",".")); return isFinite(n) ? n : null; };
const digits = s => String(s||"").replace(/\D/g,"");
const waNum = s => { let d = digits(s); if (!d) return ""; if (d.length <= 11) d = "55"+d; return d; };
const iniciais = n => String(n||"?").trim().split(/\s+/).slice(0,2).map(p=>p[0]||"").join("").toUpperCase();
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k,v); } catch(e){} };
const WA = '<svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2l-.8-.2z"/></svg>';

/* ---------- estado ---------- */
const DEFAULT_CFG = {
  estudio: "Estúdio",
  profissionais: [],
  servicos: [],
  msgs: {
    confirmacao: "Oii, {nome}! Tudo bem? Posso confirmar seu horário de {servico} {quando}, às {hora}? 💅",
    lembrete: "Oi, {nome}! Passando pra lembrar do seu horário de {servico} amanhã, {data}, às {hora}. Te espero! 💅",
    cuidados: "Oi, {nome}! Obrigada pela visita. 💕 Pra suas unhas durarem mais:\n{cuidados}\nQualquer dúvida, é só me chamar.",
    retorno: "Oi, {nome}! Já tá na hora de renovar suas unhas. 💅\n{precos}\nQuer que eu reserve um horário pra você?",
    proxima: "Oi, {nome}! Amei cuidar de você hoje. 💕\nPra suas unhas continuarem lindas, {janela}\nQual dia e horário ficam melhor pra você? Já deixo reservado!",
    proxima2: "Oi, {nome}! Passando pra ver se já dá pra marcar suas unhas de novo. 💅\n{Janela}\nQual dia e horário ficam bons pra você?"
  }
};
const S = {
  tab: "agenda", /* sempre abre no calendário do mês */
  dia: today(),
  prof: "todas",
  mes: today().slice(0,7),
  busca: "",
  cfg: null, clientes: [], ags: [], caixa: [], acomp: [], reservas: [], pedidos: [],
  pronto: {cfg:false, clientes:false, ags:false, caixa:false, acomp:false},
  db: null, canWrite: true
};
const cfg = () => S.cfg || DEFAULT_CFG;
const lista = (v, def) => (Array.isArray(v) && v.length) ? v : def;
const formas = () => lista(cfg().formas, ["Pix","Dinheiro","Cartão de débito","Cartão de crédito","Link de pagamento (crédito)"]);
/* taxas de cartão: {forma: {pct, proxDiaUtil}} */
const TAXAS_PADRAO = {"Cartão de débito":{pct:1.37,proxDiaUtil:true},"Cartão de crédito":{pct:3.15,proxDiaUtil:true},"Link de pagamento (crédito)":{pct:4.2,proxDiaUtil:true}};
const taxaDe = f => (cfg().taxas && cfg().taxas[f]) || TAXAS_PADRAO[f] || {pct:0, proxDiaUtil:false};
const proxDiaUtil = s => { let d = addDays(s,1); while ([0,6].includes(parseYmd(d).getDay())) d = addDays(d,1); return d; };
/* do valor cobrado da cliente ao que entra no caixa: desconta a taxa e move pro dia em que o dinheiro cai */
/* lança uma entrada no caixa; em combo divide entre as profissionais na proporção do combo */
async function lancarEntrada(a, valor, forma, dataPag, docBase, desc, categoria){
  if (!(valor > 0)) return true;
  if (a.divisao?.length){
    const soma = a.divisao.reduce((t,d)=>t+(Number(d.valor)||0),0) || 1; let resto = valor; let ok = true;
    for (let i=0;i<a.divisao.length;i++){ const d = a.divisao[i]; const parte = i===a.divisao.length-1 ? Math.round(resto*100)/100 : Math.round(valor*(Number(d.valor)||0)/soma*100)/100; resto -= parte;
      ok = (await run(()=>col("caixa").doc(docBase+"-"+d.profId).set({...recebimento(parte, forma, dataPag), tipo:"entrada", forma, descricao:desc+" (combo)", categoria, profId:d.profId, agendamentoId:a.id}))) && ok; }
    return ok;
  }
  return run(()=>col("caixa").doc(docBase).set({...recebimento(valor, forma, dataPag), tipo:"entrada", forma, descricao:desc, categoria, profId:a.profId, agendamentoId:a.id}));
}
const pagoAntes = a => (a.adiantamentos||[]).reduce((s,p)=>s+(Number(p.valor)||0),0);
function recebimento(bruto, forma, dataAt){
  const t = taxaDe(forma); const pct = Number(t.pct)||0;
  const liquido = Math.round(bruto*(100-pct))/100;
  return {valor: liquido, bruto, taxaPct: pct, taxaValor: Math.round((bruto-liquido)*100)/100, data: t.proxDiaUtil ? proxDiaUtil(dataAt) : dataAt, dataAtendimento: dataAt};
}
const catsEntrada = () => lista(cfg().catEntrada, ["Atendimento","Venda de produto","Outro"]);
const catsSaida = () => lista(cfg().catSaida, ["Material","Aluguel","Contas","Marketing","Outro"]);
/* ---------- reserva do studio: % do faturamento diário de cada profissional ---------- */
const CAT_RES = "Reserva do studio";
const resPct = () => { const n = Number(cfg().reservaPct); return isFinite(n) && n >= 0 ? n : 10; };
const resHora = () => /^\d{1,2}:\d{2}$/.test(cfg().reservaHora||"") ? cfg().reservaHora : "22:00";
const resInicio = () => cfg().reservaInicio || "2026-10-10";
const agoraHM = () => { const d = new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); };
function fechamentoDia(data, pid){
  const ls = S.caixa.filter(l => l.data === data && l.profId === pid);
  const fat = ls.filter(l => l.tipo === "entrada").reduce((s,l)=>s+l.valor,0);
  const sai = ls.filter(l => l.tipo === "saida" && l.categoria !== CAT_RES).reduce((s,l)=>s+l.valor,0);
  return {fat, sai, res: Math.round(fat*resPct())/100};
}
function reservasPendentes(){
  if (resPct() <= 0) return [];
  if (!S.pronto.caixa || !S.pronto.reservas || !S.cfg) return [];
  const feitos = new Set(S.reservas.map(r => r.id));
  const hoje = today(); const passouHora = agoraHM() >= resHora();
  const dias = [...new Set(S.caixa.map(l => l.data))].filter(d => d >= resInicio() && (d < hoje || (d === hoje && passouHora))).sort();
  const out = [];
  for (const d of dias) for (const p of cfg().profissionais){
    if (feitos.has(d+"_"+p.id)) continue;
    const f = fechamentoDia(d, p.id); if (f.fat <= 0) continue;
    out.push({data:d, prof:p, ...f});
  }
  return out;
}
function renderReserva(){
  const root = $("#reservaRoot"); const pend = reservasPendentes();
  document.body.classList.toggle("tem-reserva", pend.length > 0);
  if (!pend.length){ root.innerHTML = ""; return; }
  root.innerHTML = '<div class="reserva" role="region" aria-label="Fechamento do dia"><div class="box"><h3>Fechamento do dia · reserva do studio</h3><p class="note" style="margin:0">'+resPct()+'% do faturamento de cada dia vai pra conta do studio, pra investir no crescimento da empresa. Este aviso só some depois da confirmação.</p>'+
    pend.map(x => '<div class="it"><div class="row"><span class="sw" style="background:'+esc(x.prof.cor)+'"></span><b class="grow">'+esc(x.prof.nome)+'</b><span class="tag">'+esc(fmtDia(x.data))+'</span></div><div class="nums"><div><span>Faturou</span><b class="pos">'+brl(x.fat)+'</b></div><div><span>Saídas</span><b class="neg">'+brl(x.sai)+'</b></div><div><span>Ficou</span><b>'+brl(x.fat-x.sai)+'</b></div></div><div class="row"><span class="dep grow">Depositar na conta do studio: <b>'+brl(x.res)+'</b></span><button class="btn-primary" data-res="'+esc(x.data)+'|'+esc(x.prof.id)+'">Confirmar depósito</button></div></div>').join("")+'</div></div>';
  root.querySelectorAll("[data-res]").forEach(b => b.onclick = async () => {
    const [d, pid] = b.dataset.res.split("|"); const x = pend.find(p => p.data===d && p.prof.id===pid); if (!x) return;
    b.disabled = true; b.textContent = "Salvando…";
    const ok = await run(async () => {
      await col("reservas").doc(d+"_"+pid).set({data:d, profId:pid, faturado:x.fat, saidas:x.sai, pct:resPct(), valor:x.res, confirmadoEm:new Date().toISOString()});
      await col("caixa").doc("res-"+d+"-"+pid).set({data:d, tipo:"saida", valor:x.res, forma:"", categoria:CAT_RES, profId:pid, descricao:resPct()+"% do faturamento de "+fmtCurto(d)});
    }, "Depósito de "+brl(x.res)+" confirmado");
    if (!ok){ b.disabled = false; b.textContent = "Confirmar depósito"; }
  });
}
const profById = id => cfg().profissionais.find(p => p.id === id);
const svcById = id => cfg().servicos.find(s => s.id === id);
const cliById = id => S.clientes.find(c => c.id === id);
/* combos: o agendamento guarda `divisao` [{profId, valor}] e conta pras duas profissionais */
const profsDoAg = a => (a.divisao && a.divisao.length) ? a.divisao.map(d => d.profId) : [a.profId];
const agDaProf = (a, pid) => pid === "todas" || profsDoAg(a).includes(pid);
const nomesProfs = a => profsDoAg(a).map(id => profById(id)?.nome).filter(Boolean).join(" + ");

/* troca as {chaves}; linha que fica vazia (ex.: {precos} de serviço sem manutenção) some */
function fill(tpl, ctx){ return String(tpl||"").replace(/\{(\w+)\}/g, (m,k) => ctx[k] != null ? ctx[k] : m).replace(/\n[ \t]*(?=\n)/g, "").replace(/\n{2,}/g, "\n").trim(); }
/* nome do serviço como a cliente fala: sem "· colocação", "· manutenção até 20 dias" nem "Combo" */
const nomeMsg = n => String(n||"").toLowerCase().replace(/\s*·\s*(coloca[cç][aã]o|manuten[cç][aã]o.*)$/i,"").replace(/^combo\s+/i,"").trim();
const quandoDia = d => d === today() ? "hoje" : d === addDays(today(),1) ? "amanhã" : "dia "+fmtCurto(d);
/* valores da manutenção dos cílios, lidos dos serviços cadastrados ("Fox Eyes · manutenção até 20 dias" etc.).
   Cada tipo tem o seu (Megafox é diferente), então procura a família do serviço da cliente: Fio U, Fox Eyes, Megafox, Volume 5D… */
const reaisCurto = v => "R$ " + (Math.round(v) === v ? String(v) : brl(v).replace(/^R\$\s?/,""));
function faixasManut(nomeServico){
  const alvo = String(nomeServico||"").toLowerCase(); const fams = {};
  cfg().servicos.forEach(s => { const m = String(s.nome||"").match(/^(.+?)\s*·\s*manuten[cç][aã]o at[eé]\s*(\d+)\s*dias/i); if (!m || s.preco == null) return;
    const fam = m[1].replace(/^c[ií]lios\s+/i,"").trim().toLowerCase(); (fams[fam] = fams[fam] || []).push({dias:Number(m[2]), preco:Number(s.preco)}); });
  const fam = Object.keys(fams).filter(f => alvo.includes(f)).sort((a,b)=>b.length-a.length)[0];
  return fam ? fams[fam].sort((a,b)=>a.dias-b.dias) : [];
}
/* as datas de cada valor, contadas a partir do dia do atendimento (base):
   "até 20 dias" vai até base+20; "até 30 dias" vai de base+21 a base+30. Faixa que já passou não aparece. */
const diaSemana = d => fmtCurto(d)+" ("+DOW[parseYmd(d).getDay()]+")";
function precosManut(nomeServico, base){
  const ps = faixasManut(nomeServico); if (!ps.length) return "";
  if (!base) return "Vindo com até "+ps[0].dias+" dias, a manutenção fica "+reaisCurto(ps[0].preco)+ps.slice(1).map(p => "; com até "+p.dias+" dias, "+reaisCurto(p.preco)).join("")+".";
  const hoje = today(); const linhas = [];
  ps.forEach((p,i) => { const fim = addDays(base, p.dias); const ini = i ? addDays(base, ps[i-1].dias+1) : null;
    if (fim < hoje) return;
    const de = ini && ini > hoje ? ini : null;
    linhas.push("• "+(de ? "do dia "+diaSemana(de)+" ao dia "+diaSemana(fim) : "até o dia "+diaSemana(fim))+", você paga "+(i===0?"só ":"")+reaisCurto(p.preco)); });
  return linhas.join("\n");
}
/* frase da janela: em serviço normal, "o ideal é voltar entre X e Y"; nos cílios, as datas de cada valor vêm logo abaixo */
function janelaTxt(nomeServico, de, ate){ return faixasManut(nomeServico).length ? "já deixa sua manutenção garantida:" : "o ideal é voltar entre "+de+" e "+ate+"."; }
const maiuscula = t => t ? t[0].toUpperCase()+t.slice(1) : t;
function ctxAg(a){
  const c = cliById(a.clienteId) || {}; const p = profById(a.profId) || {}; const s = svcById(a.servicoId) || {};
  return { nome: (c.nome||"").split(" ")[0], servico: nomeMsg(a.servicoNome || s.nome) || "atendimento", data: fmtCurto(a.data), quando: quandoDia(a.data), hora: a.hora, prof: p.nome || "", estudio: cfg().estudio, cuidados: s.cuidados || "", precos: precosManut(a.servicoNome || s.nome, a.data) };
}
function waLink(tel, msg){ const n = waNum(tel); if (!n) return ""; return "https://wa.me/"+n+"?text="+encodeURIComponent(msg); }
function waBtn(tel, msg, label, cls, attrs){
  const href = waLink(tel, msg);
  if (!href) return '<span class="tag">sem telefone</span>';
  return '<a class="btn btn-wa '+(cls||"btn-sm")+'" href="'+esc(href)+'" target="_blank" rel="noopener"'+(attrs?" "+attrs:"")+'>'+WA+esc(label)+'</a>';
}

/* ---------- toast e modal ---------- */
let toastT;
function toast(msg){ clearTimeout(toastT); let t = $("#toast"); if (!t){ t = document.createElement("div"); t.id="toast"; t.className="toast"; t.setAttribute("role","status"); document.body.appendChild(t); } t.textContent = msg; t.hidden = false; toastT = setTimeout(()=>{ t.hidden = true; }, 2600); }
function modal(html, onMount){
  const root = $("#modalRoot");
  root.innerHTML = '<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">'+html+'</div></div>';
  const bg = root.firstChild;
  bg.addEventListener("click", e => { if (e.target === bg) closeModal(); });
  const first = bg.querySelector("input,select,textarea,button"); if (first) first.focus();
  if (onMount) onMount(bg.firstChild);
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function confirmar(texto, okLabel, fn){
  modal('<h3>'+esc(texto)+'</h3><div class="foot"><button data-x="no">Voltar</button><button class="btn-primary" data-x="ok">'+esc(okLabel)+'</button></div>', m => {
    m.querySelector('[data-x="no"]').onclick = closeModal;
    m.querySelector('[data-x="ok"]').onclick = async () => { closeModal(); await fn(); };
  });
}

/* ---------- gravação ---------- */
async function run(fn, okMsg){
  if (!S.db){ toast("Você saiu da conta. Entre de novo pra salvar."); return false; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){
    if (e && e.code === "invalid_argument" && !S.canWriteChecked){ S.canWrite = false; renderBanner(); }
    toast(e && e.code === "quota_exceeded" ? "O banco de dados está cheio. Apague registros antigos." : "Não deu pra salvar. Confira a conexão e tente de novo.");
    console.error(e); return false;
  }
}
const col = n => S.db.collection(n);

/* ---------- abas ---------- */
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; lsSet("estudio.tab", S.tab); render(); window.scrollTo(0,0); }));

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === S.tab ? "page" : "false"));
  const nomeEst = cfg().estudio || "Estúdio"; const pre = nomeEst.match(/^(st[uú]dio|est[uú]dio)\s+(.+)$/i);
  const nm = pre ? pre[2] : nomeEst;
  $("#mono").textContent = iniciais(nm);
  $("#brand").innerHTML = (pre ? '<span class="pre">'+esc(pre[1].toUpperCase())+'</span>' : '') + '<span class="nm">'+esc(nm.toUpperCase())+'</span>' + "<small>" + esc(cfg().profissionais.map(p=>p.area||p.nome).filter(Boolean).join(" · ") || "Sobrancelha · Maquiagem · Cílios") + "</small>";
  $("#todayLbl").textContent = fmtDia(today());
  const pend = S.acomp.filter(a => !a.feito && a.data <= today() && acompValido(a)).length;
  const dot = $("#dueDot"); dot.hidden = !pend; dot.textContent = pend;
  const v = $("#view");
  if (!S.db && S.dbChecked){ v.innerHTML = '<div class="empty"><b>Não deu pra carregar</b>Confira a internet e recarregue a página.</div>'; return; }
  ({agenda:viewAgenda, clientes:viewClientes, retornos:viewRetornos, caixa:viewCaixa, ajustes:viewAjustes}[S.tab] || viewAgenda)(v);
  renderReserva();
}
setInterval(() => { if (!$("#modalRoot").innerHTML) renderReserva(); }, 60000);
function renderBanner(){
  if (window.__DEMO) { $("#banner").innerHTML = ''; return; }
  $("#banner").innerHTML = S.canWrite ? "" : '<div class="banner">Você pode ver a agenda, mas não alterar. Peça pra quem criou o app te dar acesso de edição.</div>';
}
function profChips(){
  const ps = cfg().profissionais;
  if (ps.length < 2) return "";
  return '<div class="chips" role="group" aria-label="Profissional">' +

function calendarioMes(doProf){
  const mes = S.dia.slice(0,7); const first = parseYmd(mes+"-01");
  const ini = addDays(mes+"-01", -first.getDay());
  const diasNoMes = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const semanas = Math.ceil((first.getDay()+diasNoMes)/7);
  const hoje = today(); const MAX = 3;
  let html = '<div class="cal" role="grid" aria-label="Calendário do mês">'+DOW.map(d=>'<div class="dw" role="columnheader">'+d.slice(0,3)+'</div>').join("");
  for (let i=0;i<semanas*7;i++){
    const d = addDays(ini, i); const ags = S.ags.filter(a => a.data === d && doProf(a) && a.status !== "cancelado").sort((x,y)=>x.hora.localeCompare(y.hora));
    const cls = ["cell", d.slice(0,7)!==mes?"fora":"", d===hoje?"hoje":"", d===S.dia?"sel":""].filter(Boolean).join(" ");
    const evs = ags.slice(0, ags.length > MAX ? MAX-1 : MAX).map(a => { const p = profById(a.profId) || {}; const c = cliById(a.clienteId);
      return '<span class="ev'+(a.status==="concluido"?" ok":"")+(a.status==="confirmado"?" conf":"")+'" style="--c:'+esc(p.cor||"#B0843A")+'"><s>'+esc(a.hora)+'</s> '+esc(primeiroNome(c)||"Cliente")+'</span>'; }).join("");
    const mais = ags.length > MAX ? '<span class="more">+'+(ags.length-MAX+1)+'</span>' : '';
    const bqs = bloqueios().filter(b => b.data === d && bloqDoFiltro(b, S.prof));
    const evBq = bqs.length ? '<span class="ev bloq">🔒 '+(bqs.some(b=>b.diaTodo) ? "fechado" : esc(bqs[0].de))+'</span>' : '';
    html += '<button class="'+cls+'" data-dia="'+d+'" aria-label="'+esc(fmtDia(d))+(ags.length? ", "+ags.length+" horário"+(ags.length>1?"s":""):"")+'" aria-pressed="'+(d===S.dia)+'"><span class="n">'+parseYmd(d).getDate()+'</span>'+evBq+evs+mais+'</button>';
  }
  return html+'</div>';
}

  v.querySelectorAll("[data-dia]").forEach(b => b.onclick = () => { const mudouMes = b.dataset.dia.slice(0,7) !== S.dia.slice(0,7); S.dia = b.dataset.dia; render(); if (!mudouMes) { const h = $(".dayhead"); if (h && h.getBoundingClientRect().top > innerHeight*0.6) h.scrollIntoView({behavior:"smooth", block:"start"}); } });

  v.querySelectorAll("[data-pmarca]").forEach(b => b.onclick = () => marcarPedido(b.dataset.pmarca));

/* ao tocar no botão do WhatsApp de confirmação, guarda a hora do envio (o app não sabe se ela mandou mesmo, só que abriu a conversa) */

const ST = {agendado:"Agendado", confirmado:"Confirmado", concluido:"Concluído", faltou:"Faltou", cancelado:"Cancelado"};

async function acaoAg(id, act){
  const a = S.ags.find(x=>x.id===id); if (!a) return;
  if (act === "editar") return formAg(a);
  if (act === "concluir") return formConcluir(a);
  if (act === "sinal") return formSinal(a);
  if (act === "cancelado") return confirmar("Cancelar o horário de "+(cliById(a.clienteId)?.nome||"")+"?", "Cancelar horário", () => run(()=>col("agendamentos").doc(id).update({status:"cancelado"}), "Horário cancelado"));
  await run(()=>col("agendamentos").doc(id).update({status:act}), act==="faltou"?"Marcado como falta":act==="confirmado"?"Horário confirmado":"Horário reaberto");
}
function clienteOptions(sel){ return S.clientes.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>'<option value="'+esc(c.id)+'"'+(c.id===sel?" selected":"")+'>'+esc(c.nome)+'</option>').join(""); }
/* ---------- clientes: achar pelo nome ou pelo número ---------- */
const semAcento = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim();
/* compara só os últimos 8 dígitos: pega o número com ou sem DDD, com ou sem o 9 da frente */
const telChave = t => digits(t).slice(-8);
const clientePorTel = t => { const k = telChave(t); return k.length >= 8 ? S.clientes.find(c => telChave(c.telefone) === k) : null; };
const clientePorNome = n => { const k = semAcento(n); return k.length >= 3 ? S.clientes.find(c => semAcento(c.nome) === k) : null; };
function achaClientes(q, max){
  const t = String(q||"").trim(); if (!t) return [];
  const d = digits(t), k = semAcento(t);
  return S.clientes.filter(c => d.length >= 3 ? digits(c.telefone).includes(d) : semAcento(c.nome).includes(k))
    .sort((a,b)=>a.nome.localeCompare(b.nome)).slice(0, max||8);
}
const linhaCli = (c, botao) => '<div class="line"><span class="av">'+esc(iniciais(c.nome))+'</span><div class="grow"><b>'+esc(c.nome)+'</b><small>'+esc(c.telefone||"sem telefone")+'</small></div>'+botao+'</div>';

/* ---------- dias e horários fechados (compromisso, folga): ficam na config ---------- */
const bloqueios = () => cfg().bloqueios || [];
const bloqIni = b => b.diaTodo ? 0 : toMin(b.de);
const bloqFim = b => b.diaTodo ? 24*60 : toMin(b.ate);
const bloqTodas = b => !b.profId || b.profId === "todas";
const bloqDoFiltro = (b, pid) => pid === "todas" || bloqTodas(b) || b.profId === pid;
const txtBloq = b => b.diaTodo ? "o dia todo" : "das "+b.de+" às "+b.ate;
const quemBloq = b => bloqTodas(b) ? "Todas" : (profById(b.profId)?.nome || "");
function bloqueioEm(data, ini, fim, profs){ return bloqueios().find(b => b.data === data && ini < bloqFim(b) && fim > bloqIni(b) && (bloqTodas(b) || profs.includes(b.profId))); }
function cardBloq(b){

const domRe = () => { try { return new RegExp(cfg().domicilioServicos || "maquiagem|penteado|babyliss", "i"); } catch(e){ return /maquiagem|penteado|babyliss/i; } };
const taxaDom = () => { const t = Number(cfg().taxaDomicilio); return isFinite(t) && cfg().taxaDomicilio != null ? t : 30; };

function partesDe(ids, pidPadrao, extra, pidExtra){
  const m = new Map(); const soma = (pid, v) => { if (!pid) return; m.set(pid, Math.round(((m.get(pid)||0) + (Number(v)||0))*100)/100); };
  ids.forEach(id => { const s = svcById(id); if (!s) return; if (s.divisao?.length) s.divisao.forEach(d => soma(d.profId, d.valor)); else soma(s.profId || pidPadrao, s.preco); });
  if (extra) soma(pidExtra || pidPadrao, extra);

}

      const forma = m.querySelector("#cForma").value; const querCuid = m.querySelector("#cCuid").checked; const querRet = m.querySelector("#cRet")?.checked;
      closeModal();
      const ok = await run(()=>col("agendamentos").doc(a.id).update({status:"concluido", pago:{valor: Math.round((valor+jaPago)*100)/100, hoje: valor, adiantado: jaPago, forma, em: today()}})); if (!ok) return;
      const desc = (c.nome||"Cliente")+" · "+(a.servicoNome||s.nome||"")+(jaPago>0?" (restante)":"");
      await lancarEntrada(a, valor, forma, a.data, "ag-"+a.id, desc, "Atendimento");
      const base = {clienteId:a.clienteId, agendamentoId:a.id, profId:a.profId, servicoId:a.servicoId, servicoNome:a.servicoNome||s.nome||"", feito:false};
      if (querCuid) await run(()=>col("acompanhamentos").doc("cuid-"+a.id).set({...base, tipo:"cuidados", data: addDays(a.data,1)}));
      if (querRet) for (let i=0;i<rets.length;i++){ const r = rets[i]; await run(()=>col("acompanhamentos").doc(rets.length>1 ? "ret-"+a.id+"-"+i : "ret-"+a.id).set({...base, profId:r.profId, servicoId:r.servicoId, servicoNome:r.nome, tipo:"retorno", data: addDays(a.data, r.dias)})); }
      toast("Atendimento concluído e lançado no caixa");
      if (svcsDoAg(a).some(x => chamaProxima(x.nome||svcById(x.id)?.nome||""))) await proporProxima(a);
    };
  });
}
/* ---------- próxima visita: ao concluir, já chama a cliente pra marcar a próxima (manutenção, retorno da brow, design) ---------- */
const janDe = () => Number(cfg().proxDe) || 20;
const janAte = () => Number(cfg().proxAte) || 30;
/* maquiagem, penteado e babyliss são de evento: não têm "próxima" */
const chamaProxima = nome => { try { return !new RegExp(cfg().semProxima || "maquiagem|penteado|babyliss", "i").test(nome); } catch(e){ return true; } };
const temHorarioFuturo = (cid, depoisDe) => S.ags.some(x => x.clienteId === cid && x.data > (depoisDe || today()) && (x.status === "agendado" || x.status === "confirmado"));
function ctxProx(x){
  const c = cliById(x.clienteId) || {}; const base = x.base || x.data;
  const de = fmtCurto(addDays(base, x.de ?? janDe())), ate = fmtCurto(addDays(base, x.ate ?? janAte())); const jan = janelaTxt(x.servicoNome, de, ate);
  return {nome: primeiroNome(c), servico: nomeMsg(x.servicoNome) || "atendimento", de, ate, janela: jan, Janela: maiuscula(jan), prof: profById(x.profId)?.nome || "", estudio: cfg().estudio, data:"", hora:"", cuidados:"", precos: precosManut(x.servicoNome, base)};
}
async function proporProxima(a){
  const c = cliById(a.clienteId) || {}; if (temHorarioFuturo(a.clienteId, a.data)) return;
  const doc = {tipo:"proxima", clienteId:a.clienteId, agendamentoId:a.id, profId:a.profId, servicoId:a.servicoId, servicoNome:a.servicoNome||"", base:a.data, de:janDe(), ate:janAte(), data:today(), feito:false, enviadas:0};
  await run(()=>col("acompanhamentos").doc("prox-"+a.id).set(doc));
  const msg = fill(cfg().msgs.proxima, ctxProx(doc));
  modal('<h3>Chamar '+esc(primeiroNome(c)||"a cliente")+' pra próxima</h3><p class="note">Ela acabou de sair. É a melhor hora pra deixar a próxima marcada, entre '+esc(ctxProx(doc).de)+' e '+esc(ctxProx(doc).ate)+'. Pode ajustar o texto antes de mandar.</p>'+
    '<textarea id="pxMsg" style="min-height:120px">'+esc(msg)+'</textarea><div class="foot"><button id="pxDepois">Depois</button>'+(waLink(c.telefone,"x") ? '<a class="btn btn-wa" id="pxWa" target="_blank" rel="noopener" href="'+esc(waLink(c.telefone, msg))+'">'+WA+'Mandar no WhatsApp</a>' : '<span class="tag">Ela está sem telefone cadastrado</span>')+'</div>'+
    '<p class="note" style="margin-top:10px">Se não mandar agora, ela fica na aba Retornos até ter o próximo horário marcado.</p>', m => {
    const ta = m.querySelector("#pxMsg"); const wa = m.querySelector("#pxWa");
    if (wa){ ta.oninput = () => { wa.href = waLink(c.telefone, ta.value); }; wa.addEventListener("click", () => { closeModal(); marcarEnvioProx("prox-"+a.id, 0); }); }
    m.querySelector("#pxDepois").onclick = closeModal;
  });
}
/* depois de chamar, volta pra lista em 2 dias se ela ainda não tiver marcado */
function marcarEnvioProx(id, enviadas){ return run(()=>col("acompanhamentos").doc(id).update({enviadoEm: today(), enviadas: (enviadas||0)+1, data: addDays(today(), 2)}), "Mensagem aberta no WhatsApp. Se ela não marcar, volta pra lista em 2 dias."); }

    (c.nascimento?'<p class="note">Aniversário: '+fmtCurto(c.nascimento)+'</p>':'')+

    '<div class="foot"><button id="fcEd">Editar dados</button><button id="fcX">Fechar</button><button class="btn-primary" id="fcAg">Marcar horário</button></div>', m => {

/* cópia de tudo num arquivo .json, pra guardar de vez em quando (o plano gratuito não tem backup automático) */
async function baixarCopia(){
  if (!S.db) return;
  const out = {geradoEm: new Date().toISOString(), config: {}, colecoes: {}};
  try {
    const g = await S.db.doc("config/geral").get(); if (g.exists) out.config.geral = g.data();
    for (const n of COLECOES){ const q = await S.db.collection(n).get(); out.colecoes[n] = {}; q.docs.forEach(d => out.colecoes[n][d.id] = d.data()); }
    const blob = new Blob([JSON.stringify(out, null, 1)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "atelie-rose-copia-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove();
    toast("Cópia baixada");
  } catch(e){ console.error(e); toast("Não deu pra gerar a cópia. Tente de novo."); }
}
/* volta uma cópia (.json) pro banco; usado na mudança do app pro Firebase e pra restaurar uma cópia */
async function importarCopia(dados){
  const escritas = [];
  if (dados.config?.geral) escritas.push(["config","geral",dados.config.geral]);
  Object.entries(dados.colecoes||{}).forEach(([n, docs]) => { if (COLECOES.includes(n)) Object.entries(docs||{}).forEach(([id, d]) => escritas.push([n, id, d])); });
  for (let i = 0; i < escritas.length; i += 400){
    const b = S.db.batch();
    escritas.slice(i, i+400).forEach(([n, id, d]) => b.set(S.db.collection(n).doc(id), d));
    await b.commit();
  }
  return escritas.length;
}
window.__essence = { importarCopia: d => importarCopia(d) };

(function(){
  if (!window.firebase){ S.dbChecked = true; render(); toast("Não deu pra carregar. Confira a internet e recarregue."); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth = firebase.auth(); const db = firebase.firestore();
  db.settings({ignoreUndefinedProperties: true, merge: true});
  db.enablePersistence({synchronizeTabs: true}).catch(() => {});
  let unsub = [];
  $("#lgForm").onsubmit = async e => {
    e.preventDefault(); const b = $("#lgBtn"); b.disabled = true; b.textContent = "Entrando…"; $("#lgMsg").textContent = "";
    try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); await auth.signInWithEmailAndPassword($("#lgEmail").value.trim(), $("#lgSenha").value); }
    catch(err){ $("#lgMsg").textContent = ERROS_LOGIN[err.code] || "Não deu pra entrar. Tente de novo."; console.error(err); }
    b.disabled = false; b.textContent = "Entrar";
  };
  $("#lgEsqueci").onclick = async () => {
    const email = $("#lgEmail").value.trim(); if (!email) { $("#lgMsg").textContent = "Escreva seu e-mail acima e toque de novo em “Esqueci a senha”."; return; }
    try { await auth.sendPasswordResetEmail(email); $("#lgMsg").textContent = "Mandamos um link pra criar uma senha nova no e-mail "+email+". Olhe também o spam."; }
    catch(err){ $("#lgMsg").textContent = ERROS_LOGIN[err.code] || "Não deu pra mandar o e-mail agora."; }
  };
  window.__sair = () => auth.signOut();
  auth.onAuthStateChanged(user => {
    unsub.forEach(f => f()); unsub = [];
    if (!user){ S.db = null; S.user = null; S.dbChecked = false; telaLogin(true); return; }
    S.user = user; S.db = db; S.dbChecked = true; telaLogin(false, ""); renderBanner();
    const fail = e => { console.error(e); if (e && e.code === "permission-denied"){ toast("Este e-mail não tem acesso à agenda do estúdio."); auth.signOut(); } else toast("A conexão com o banco caiu. Recarregue a página."); };
    unsub.push(db.doc("config/geral").onSnapshot(s => { S.cfg = s.exists ? {...DEFAULT_CFG, ...s.data(), msgs:{...DEFAULT_CFG.msgs, ...(s.data().msgs||{})}} : null; render(); }, fail));
    unsub.push(db.collection("clientes").onSnapshot(q => { S.clientes = q.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fail));
    unsub.push(db.collection("agendamentos").orderBy("data","desc").limit(1000).onSnapshot(q => { S.ags = q.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fail));
    unsub.push(db.collection("caixa").orderBy("data","desc").limit(1000).onSnapshot(q => { S.caixa = q.docs.map(d => ({id:d.id, ...d.data(), valor: Number(d.data().valor)||0})); S.pronto.caixa = true; render(); }, fail));
    unsub.push(db.collection("acompanhamentos").where("feito","==",false).onSnapshot(q => { S.acomp = q.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fail));
    unsub.push(db.collection("pedidos").onSnapshot(q => { S.pedidos = q.docs.map(d => ({id:d.id, ...d.data()})).sort((x,y)=>String(x.criadoEm).localeCompare(String(y.criadoEm))); render(); }, fail));
    unsub.push(db.collection("reservas").orderBy("data","desc").limit(1000).onSnapshot(q => { S.reservas = q.docs.map(d => ({id:d.id, ...d.data()})); S.pronto.reservas = true; render(); }, fail));
  });
})();
})();
</script>

</body>
</html>
